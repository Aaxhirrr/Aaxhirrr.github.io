<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4: Story-Driven Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Target: position: sticky, 4 buttons distributed using flexbox -->
    <header class="sticky-nav">
        <button class="nav-btn">The Last of Us II</button>
        <button class="nav-btn">Red Dead Redemption 2</button>
        <button class="nav-btn">Life is Strange</button>
        <button class="nav-btn">The Walking Dead</button>
    </header>

    <!-- Target: Grid layout for desktop (2x2) and mobile (1 column) -->
    <main class="grid-container">
        
        <!-- Target: Div within grid uses flexbox. Aligned to center, does not wrap -->
        <div class="card">
            <img src="images/tlou2.png" alt="The Last of Us Part II" class="card-img">
            <div class="card-content">
                <h2>The Last of Us II</h2>
                <p>A relentless journey of revenge and survival.</p>
                <div class="card-actions">
                    <button class="action-btn">Play</button>
                    <button class="action-btn outline">Details</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="images/rdr2.png" alt="Red Dead Redemption 2" class="card-img">
            <div class="card-content">
                <h2>Red Dead Redemption 2</h2>
                <p>An epic tale of outlaws in the dying Wild West.</p>
                <div class="card-actions">
                    <button class="action-btn">Play</button>
                    <button class="action-btn outline">Details</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="images/lis.png" alt="Life is Strange" class="card-img">
            <div class="card-content">
                <h2>Life is Strange</h2>
                <p>Choice-based narrative with time-rewinding powers.</p>
                <div class="card-actions">
                    <button class="action-btn">Play</button>
                    <button class="action-btn outline">Details</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="images/twd.png" alt="The Walking Dead" class="card-img">
            <div class="card-content">
                <h2>The Walking Dead</h2>
                <p>Emotional journey through a zombie apocalypse.</p>
                <div class="card-actions">
                    <button class="action-btn">Play</button>
                    <button class="action-btn outline">Details</button>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
