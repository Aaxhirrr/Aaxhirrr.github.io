<!DOCTYPE html>
<html>
<head>
  <title>Week 2 Skeleton Page</title>
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background: #ffd85a;
      color: #2f1e12;
    }

    .hero-panel {
      width: min(760px, 92%);
      margin: 40px auto;
      padding: 24px;
      border: 4px solid #2f1e12;
      border-radius: 22px;
      background: #fff7ec;
      box-shadow: 8px 8px 0 #2f1e12;
    }

    .hero-panel {
      text-align: center;
    }

    .skeleton-box {
      margin: 24px auto;
      width: 320px;
      padding: 24px 18px;
      border: 4px dashed #2f1e12;
      border-radius: 18px;
      background: #ffffff;
    }

    #skeleton-face {
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: 0;
      margin: 0;
      white-space: pre;
    }

    #skeleton-mood {
      margin: 16px 0 0;
      font-weight: bold;
      font-size: 20px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    button,
    a {
      font: inherit;
      padding: 10px 16px;
      border: 3px solid #2f1e12;
      border-radius: 999px;
      background: #ff9f43;
      color: #2f1e12;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 3px 3px 0 #2f1e12;
    }

    button:hover,
    a:hover {
      background: #ffbe76;
    }
  </style>
</head>
<body>
  <section class="hero-panel">
    <h1 id="page-title">Build-A-Skeleton Page</h1>
    <p id="page-description">
      Press the buttons and wake this lazy skeleton up.
    </p>

    <div class="skeleton-box">
      <p id="skeleton-face">   .-.
  (x_x)
   /|\
  _/ \_</p>
      <p id="skeleton-mood">Status: still just a pile of bones.</p>
    </div>

    <div class="button-row">
      <button id="build-button" onclick="buildSkeleton()">Build It</button>
      <button id="dance-button" onclick="danceSkeleton()">Make It Dance</button>
      <a id="game-link" href="./ourfirstgame/index.html">Open My Game</a>
    </div>
  </section>

  <script>
    function buildSkeleton() {
      document.getElementById("skeleton-face").textContent = "   .-.\n  (o_o)\n   /|\\\\\n  _/ \\\\_";
      document.getElementById("skeleton-mood").textContent = "Status: built and standing.";
    }

    function danceSkeleton() {
      document.getElementById("skeleton-face").textContent = " \\o_o/\n   |\n  / \\\\\n _| |_";
      document.getElementById("skeleton-mood").textContent = "Status: dancing like it got an A.";
    }
  </script>
</body>
</html>
